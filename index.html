<!DOCTYPE html>

<html>

<body>

    <p>Próxima atualização em: <span id="contador">10</span>s</p>
    <button type="button" onclick="reloadAll()">Reload</button>

    <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <tr>
            <td valign="top">
                <h2>Brasil - Presidente</h2>
                <p id="titulo"></p>
                <ul id="apuracao"></ul>
            </td>
            <td valign="top">
                <h2>São Paulo (SP) - Presidente</h2>
                <p id="titulo-sp-p"></p>
                <ul id="apuracao-sp-p"></ul>
            </td>
        </tr>
        <tr>
            <td valign="top">
                <h2>São Paulo (SP) - Governador</h2>
                <p id="titulo-sp-g"></p>
                <ul id="apuracao-sp-g"></ul>
            </td>
            <td valign="top">
                <h2>São Paulo (SP) - Senador</h2>
                <p id="titulo-sp-s"></p>
                <ul id="apuracao-sp-s"></ul>
            </td>
        </tr>
    </table>

    <h2>Apuração por região</h2>
    <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <tr>
            <th>Norte</th>
            <th>Nordeste</th>
            <th>Centro-Oeste</th>
            <th>Sudeste</th>
            <th>Sul</th>
        </tr>
        <tr valign="top">
            <td><ul id="apuracao-norte"></ul></td>
            <td><ul id="apuracao-nordeste"></ul></td>
            <td><ul id="apuracao-centro-oeste"></ul></td>
            <td><ul id="apuracao-sudeste"></ul></td>
            <td><ul id="apuracao-sul"></ul></td>
        </tr>
    </table>

    <script>
        let timeLeft = 10;
        const regioes = {
            norte: ["AC", "AM", "AP", "PA", "RO", "RR", "TO"],
            nordeste: ["AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE"],
            "centro-oeste": ["DF", "GO", "MS", "MT"],
            sudeste: ["ES", "MG", "RJ", "SP"],
            sul: ["PR", "RS", "SC"]
        };

        function trataApuracaoGenerica(jsonApuracao, tituloId, apuracaoId) {
            const titulo = document.getElementById(tituloId);
            const apuracao = document.getElementById(apuracaoId);
            apuracao.innerHTML = "";

            titulo.innerHTML = (jsonApuracao.s && jsonApuracao.s.pst ? jsonApuracao.s.pst : "0") + "% das urnas apuradas";

            const candidatos = [];
            (jsonApuracao.carg || []).forEach(function (cargo) {
                (cargo.agr || []).forEach(function (grupo) {
                    (grupo.par || []).forEach(function (partido) {
                        (partido.cand || []).forEach(function (candidato) {
                            candidatos.push(candidato);
                        });
                    });
                });
            });

            candidatos.sort(function (a, b) {
                const pvapA = parseFloat(String(a.pvap).replace(',', '.')) || 0;
                const pvapB = parseFloat(String(b.pvap).replace(',', '.')) || 0;
                return pvapB - pvapA;
            });

            candidatos.forEach(function (candidato, index) {
                const node = document.createElement("li");
                const textnode = document.createTextNode(
                    candidato.nm + ": (" + Number(candidato.vap || 0).toLocaleString("pt-BR") + ") " + candidato.pvap + "%"
                );
                node.appendChild(textnode);

                if (index < 2) {
                    node.style.color = "green";
                } else if (index >= candidatos.length - 2) {
                    node.style.color = "red";
                } else {
                    node.style.color = "black";
                }

                apuracao.appendChild(node);
            });
        }

        function carregaApuracao(url, tituloId, apuracaoId) {
            const xhttp = new XMLHttpRequest();
            const cargo = {
                "titulo-sp-g": "Governador",
                "titulo-sp-s": "Senador"
            }[tituloId];
            const exibeErro = function (status) {
                const detalhe = cargo && status === 404
                    ? "Dados de " + cargo + " ainda não disponíveis no TSE (HTTP 404)."
                    : "Não foi possível carregar a apuração.";
                document.getElementById(tituloId).innerText = detalhe;
                document.getElementById(apuracaoId).innerHTML = "";
            };
            xhttp.onload = function () {
                if (this.status < 200 || this.status >= 300) {
                    exibeErro(this.status);
                    console.error("Falha ao carregar apuração:", url, this.status);
                    return;
                }

                try {
                    trataApuracaoGenerica(JSON.parse(this.responseText), tituloId, apuracaoId);
                } catch (error) {
                    exibeErro();
                    console.error("Resposta inválida da apuração:", url, error);
                }
            };
            xhttp.onerror = function () {
                exibeErro();
                console.error("Erro de rede ao carregar apuração:", url);
            };
            xhttp.open("GET", url);
            xhttp.send();
        }

        function reloadApuracaoBr() {
            carregaApuracao("https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-c0001-e006257-u.json", "titulo", "apuracao");
        }

        function reloadApuracaoSpPresidente() {
            carregaApuracao("https://resultados.tse.jus.br/oficial/ele2026/6257/dados/sp/sp-c0001-e006257-u.json", "titulo-sp-p", "apuracao-sp-p");
        }

        function reloadApuracaoSpGovernador() {
            carregaApuracao("https://resultados.tse.jus.br/oficial/ele2026/6259/dados/sp/sp-c0003-e006259-u.json", "titulo-sp-g", "apuracao-sp-g");
        }

        function reloadApuracaoSpSenador() {
            carregaApuracao("https://resultados.tse.jus.br/oficial/ele2026/6259/dados/sp/sp-c0005-e006259-u.json", "titulo-sp-s", "apuracao-sp-s");
        }

        function reloadApuracaoUfs() {
            const url = "https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-e006257-ab.json";
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                if (this.status < 200 || this.status >= 300) {
                    exibeErroApuracaoUfs(url, this.status);
                    return;
                }

                try {
                    const dados = JSON.parse(this.responseText);
                    const porUf = {};
                    (dados.abr || []).forEach(function (abrangencia) {
                        if (abrangencia.tpabr === "uf") {
                            porUf[abrangencia.cdabr.toUpperCase()] = abrangencia.s && abrangencia.s.pst
                                ? abrangencia.s.pst
                                : "0";
                        }
                    });

                    Object.keys(regioes).forEach(function (regiao) {
                        const lista = document.getElementById("apuracao-" + regiao);
                        lista.innerHTML = "";
                        regioes[regiao].forEach(function (uf) {
                            const item = document.createElement("li");
                            const percentual = porUf[uf] || "0";
                            item.appendChild(document.createTextNode(uf + ": " + percentual + "%"));

                            const valorPercentual = parseFloat(String(percentual).replace(",", ".")) || 0;
                            if (valorPercentual >= 100) {
                                item.style.color = "green";
                            } else if (valorPercentual < 25) {
                                item.style.color = "red";
                            }

                            lista.appendChild(item);
                        });
                    });
                } catch (error) {
                    exibeErroApuracaoUfs(url, error);
                }
            };
            xhttp.onerror = function () {
                exibeErroApuracaoUfs(url, "erro de rede");
            };
            xhttp.open("GET", url);
            xhttp.send();
        }

        function exibeErroApuracaoUfs(url, erro) {
            Object.keys(regioes).forEach(function (regiao) {
                const lista = document.getElementById("apuracao-" + regiao);
                lista.innerHTML = "";
                const item = document.createElement("li");
                item.appendChild(document.createTextNode("Não foi possível carregar a apuração."));
                lista.appendChild(item);
            });
            console.error("Falha ao carregar apuração por UF:", url, erro);
        }

        function reloadAll() {
            reloadApuracaoBr();
            reloadApuracaoSpPresidente();
            reloadApuracaoSpGovernador();
            reloadApuracaoSpSenador();
            reloadApuracaoUfs();
            timeLeft = 10;
        }

        // Carrega inicialmente
        reloadAll();

        // Timer de contagem regressiva a cada 1 segundo
        setInterval(function () {
            timeLeft--;
            if (timeLeft <= 0) {
                reloadAll();
            }
            const contadorEl = document.getElementById("contador");
            if (contadorEl) {
                contadorEl.innerText = timeLeft;
            }
        }, 1000);
    </script>

</body>

</html>
